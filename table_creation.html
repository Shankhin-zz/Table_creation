<!DOCTYPE html>
<html>
    <head>

        <title>
            table creation
        </title>

    </head>
    <body>
        <table border="2px" height="200px" width="100%">
            <tr>
                <th>Col head1</th>
                <th>Col head2</th>
                <th>Col head3</th>
                <th>Col head4</th>
                <th>Col head5</th>


            </tr>
            <tr>
                <td>Row1 cell1</td>
                <td bgcolor="yellow">Row1 cell2</td>
                <td>Row1 cell3</td>
                <td>Row1 cell4</td>
                <td>Row1 cell5</td>


            </tr>
            <tr>
                <td>Row2 cell1</td>
                <td colspan="2">Row2 cell2</td>
                <td>Row2 cell3</td>
                <td rowspan="2">Row2 cell4</td>

            </tr>
            <tr>
                <td>Row3 cell1</td>
                <td rowspan="2">Row1 cell2</td>
                <td>Row2 cell3</td>
                <td><b>Row3 cell4</b></td>

            </tr>
            <tr>
                <td>Row4 cell1</td>
                <td>Row4 cell2</td>
                <td bgcolor="sky blue">Row4 cell3</td>
                <td>Row4 cell4</td>


            </tr>

    </body>






</html>
